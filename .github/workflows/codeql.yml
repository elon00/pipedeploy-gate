name: CodeQL Python Security Analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize Python CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Analyze Python
        uses: github/codeql-action/analyze@v3
